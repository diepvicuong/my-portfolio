<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Throwaway UI prototype for Cuong Diep's Senior Mobile Engineer portfolio." />
    <title>Mobile Systems Lab · Prototype</title>
    <style>
      :root {
        --ink: #101217;
        --paper: #f1f0ea;
        --muted: #9ca3ad;
        --line: rgba(255, 255, 255, 0.14);
        --panel: rgba(255, 255, 255, 0.07);
        --cyan: #8ef4df;
        --lime: #d4ff5f;
        --blue: #6678ff;
        --serif: Georgia, 'Times New Roman', serif;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; background: #0d1015; color: white; font-family: var(--sans); }
      button, a { font: inherit; }
      a { color: inherit; text-decoration: none; }
      button { border: 0; cursor: pointer; }
      .prototype-flag { position: fixed; z-index: 100; top: 14px; left: 50%; transform: translateX(-50%); padding: 7px 11px; border: 1px solid rgba(255,255,255,.23); border-radius: 999px; color: #e6e8eb; background: rgba(5,7,10,.72); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; backdrop-filter: blur(12px); }
      .app { min-height: 100vh; overflow: hidden; }
      .variant { min-height: 100vh; }
      .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
      .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--cyan); font: 11px var(--mono); letter-spacing: .15em; text-transform: uppercase; }
      .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 20px currentColor; content: ''; }
      .micro { color: var(--muted); font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .display { margin: 0; font-size: clamp(3.2rem, 8vw, 7.9rem); font-weight: 650; letter-spacing: -.075em; line-height: .91; }
      .body-copy { max-width: 560px; color: #b7bec8; font-size: 1.04rem; line-height: 1.75; }
      .button { display: inline-flex; align-items: center; gap: 12px; padding: 13px 17px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; color: white; background: rgba(255,255,255,.07); font-size: .85rem; font-weight: 650; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
      .button:hover { transform: translateY(-2px); border-color: var(--cyan); background: rgba(142,244,223,.13); }
      .button.primary { border-color: var(--cyan); color: #091312; background: var(--cyan); }
      .button.primary:hover { background: #c2fff2; }
      .button.dark { color: var(--ink); background: var(--ink); border-color: var(--ink); }
      .button.dark:hover { color: white; background: #262b36; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag { padding: 7px 9px; border: 1px solid rgba(255,255,255,.13); border-radius: 5px; color: #d3d8dd; background: rgba(255,255,255,.05); font: 11px var(--mono); }

      /* Variant A — Signal Console: a precise split-screen systems dashboard. */
      .variant-a { background: radial-gradient(circle at 78% 12%, rgba(67, 174, 161, .15), transparent 29rem), #0d1015; }
      .variant-a .topbar { display: flex; align-items: center; justify-content: space-between; height: 78px; border-bottom: 1px solid var(--line); }
      .variant-a .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; }
      .variant-a .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid var(--cyan); border-radius: 7px; color: var(--cyan); font: 11px var(--mono); }
      .variant-a nav { display: flex; gap: 24px; color: #a5acb6; font: 11px var(--mono); text-transform: uppercase; }
      .variant-a nav a:hover { color: var(--cyan); }
      .variant-a .hero { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(360px, .98fr); align-items: center; gap: 70px; min-height: 730px; padding: 100px 0 110px; }
      .variant-a .hero h1 { max-width: 730px; margin-top: 24px; }
      .variant-a .hero h1 em { color: var(--cyan); font-style: normal; }
      .variant-a .body-copy { margin: 28px 0 0; }
      .variant-a .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
      .variant-a .signal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 46px; }
      .variant-a .signal { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.03); }
      .variant-a .signal strong { display: block; margin-top: 8px; color: #f7f8f9; font-size: 1.05rem; }
      .variant-a .signal span { color: #7e8794; font: 10px var(--mono); text-transform: uppercase; }
      .variant-a .console { position: relative; padding: 14px; border: 1px solid rgba(142,244,223,.3); border-radius: 20px; background: rgba(18, 25, 29, .85); box-shadow: 0 30px 90px rgba(0,0,0,.33), 0 0 70px rgba(142,244,223,.08); }
      .variant-a .console::before { position: absolute; top: -50px; right: -30px; width: 160px; height: 160px; border: 1px solid rgba(142,244,223,.17); border-radius: 50%; content: ''; }
      .variant-a .console-head { display: flex; justify-content: space-between; padding: 6px 4px 13px; color: #8c969e; font: 10px var(--mono); }
      .variant-a .live { display: inline-flex; align-items: center; gap: 6px; color: var(--cyan); }
      .variant-a .live::before { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); content: ''; }
      .variant-a .device { position: relative; min-height: 475px; overflow: hidden; padding: 28px 23px; border-radius: 16px; background: linear-gradient(148deg, #1c2c30, #0c1114 54%, #15272b); }
      .variant-a .device::after { position: absolute; right: -100px; bottom: -100px; width: 300px; height: 300px; border: 1px solid rgba(142,244,223,.2); border-radius: 50%; box-shadow: 0 0 0 33px rgba(142,244,223,.04), 0 0 0 66px rgba(142,244,223,.025); content: ''; }
      .variant-a .device-top { display: flex; align-items: center; justify-content: space-between; color: #9ab6b3; font: 10px var(--mono); }
      .variant-a .device-title { margin: 69px 0 10px; font-size: 2.3rem; font-weight: 620; letter-spacing: -.06em; }
      .variant-a .device-sub { max-width: 230px; color: #9dafb0; font-size: .8rem; line-height: 1.6; }
      .variant-a .chart { display: flex; align-items: end; gap: 7px; height: 110px; margin-top: 40px; }
      .variant-a .chart i { flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(#8ef4df, rgba(142,244,223,.1)); opacity: .83; }
      .variant-a .chart i:nth-child(1) { height: 28%; } .variant-a .chart i:nth-child(2) { height: 45%; } .variant-a .chart i:nth-child(3) { height: 35%; } .variant-a .chart i:nth-child(4) { height: 68%; } .variant-a .chart i:nth-child(5) { height: 52%; } .variant-a .chart i:nth-child(6) { height: 85%; } .variant-a .chart i:nth-child(7) { height: 72%; } .variant-a .chart i:nth-child(8) { height: 100%; }
      .variant-a .device-footer { position: absolute; right: 24px; bottom: 21px; left: 24px; display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); color: #7d9996; font: 10px var(--mono); }
      .variant-a .section { padding: 90px 0; border-top: 1px solid var(--line); }
      .variant-a .section-head { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 32px; }
      .variant-a .section h2 { max-width: 600px; margin: 13px 0 0; font-size: clamp(2rem, 4vw, 3.9rem); letter-spacing: -.06em; line-height: .98; }
      .variant-a .project-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
      .variant-a .project { min-height: 270px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      .variant-a .project:first-child { min-height: 420px; background: linear-gradient(140deg, rgba(142,244,223,.14), rgba(255,255,255,.03) 47%); }
      .variant-a .project h3 { margin: 80px 0 9px; font-size: 1.6rem; letter-spacing: -.05em; }
      .variant-a .project:not(:first-child) h3 { margin-top: 40px; }
      .variant-a .project p { max-width: 390px; margin: 0; color: #9ca6b1; line-height: 1.6; }

      /* Variant B — Field Notes: editorial, light, case-study first. */
      .variant-b { color: var(--ink); background: var(--paper); }
      .variant-b .shell { width: min(1240px, calc(100% - 56px)); }
      .variant-b .topbar { display: flex; align-items: center; justify-content: space-between; height: 92px; border-bottom: 1px solid rgba(16,18,23,.18); }
      .variant-b .brand { font: 650 1rem var(--mono); letter-spacing: -.05em; }
      .variant-b nav { display: flex; gap: 25px; color: #59606a; font: 11px var(--mono); text-transform: uppercase; }
      .variant-b nav a:hover { color: var(--ink); }
      .variant-b .hero { display: grid; grid-template-columns: .88fr 1.12fr; gap: 80px; padding: 110px 0 120px; }
      .variant-b .hero .eyebrow { color: #5e6cff; }
      .variant-b .hero h1 { max-width: 560px; margin-top: 24px; font: 500 clamp(3.5rem, 8vw, 8.5rem)/.83 var(--serif); letter-spacing: -.09em; }
      .variant-b .hero h1 em { color: #5e6cff; font-style: italic; }
      .variant-b .body-copy { margin: 32px 0 0; color: #535a64; }
      .variant-b .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 33px; }
      .variant-b .hero-notes { align-self: end; padding-bottom: 12px; }
      .variant-b .hero-notes p { max-width: 410px; margin: 0 0 45px; color: #454b54; font: 500 clamp(1.45rem, 2.5vw, 2.3rem)/1.13 var(--serif); letter-spacing: -.045em; }
      .variant-b .note-line { display: flex; justify-content: space-between; padding: 13px 0; border-top: 1px solid rgba(16,18,23,.16); color: #636a74; font: 11px var(--mono); }
      .variant-b .note-line strong { color: var(--ink); font-weight: 500; }
      .variant-b .case-section { padding: 74px 0 120px; border-top: 1px solid rgba(16,18,23,.18); }
      .variant-b .case-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; }
      .variant-b .case-head h2 { margin: 0; font: 500 clamp(2.4rem, 5vw, 5.6rem)/.9 var(--serif); letter-spacing: -.08em; }
      .variant-b .case-head span { color: #666d75; font: 11px var(--mono); }
      .variant-b .case-list { border-top: 1px solid rgba(16,18,23,.18); }
      .variant-b .case { display: grid; grid-template-columns: 80px minmax(180px, .75fr) 1.25fr 120px; gap: 28px; align-items: start; padding: 28px 0; border-bottom: 1px solid rgba(16,18,23,.18); transition: padding .2s ease, background .2s ease; }
      .variant-b .case:hover { padding-right: 16px; padding-left: 16px; background: rgba(255,255,255,.55); }
      .variant-b .case-index { color: #737a82; font: 11px var(--mono); }
      .variant-b .case h3 { margin: 0; font: 500 clamp(1.4rem, 2.2vw, 2.2rem) var(--serif); letter-spacing: -.045em; }
      .variant-b .case p { margin: 0; color: #565e67; font-size: .85rem; line-height: 1.65; }
      .variant-b .case .case-link { justify-self: end; color: #5e6cff; font: 11px var(--mono); text-transform: uppercase; }
      .variant-b .manifesto { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 94px 0 0; }
      .variant-b .manifesto h2 { margin: 0; font: 500 clamp(2.3rem, 4vw, 4.2rem)/.95 var(--serif); letter-spacing: -.07em; }
      .variant-b .manifesto p { max-width: 390px; margin: 0; color: #535a64; font: 1.1rem/1.65 var(--serif); }

      /* Variant C — Orbit Stack: immersive visual stage with a vertical system path. */
      .variant-c { background: #08090d; }
      .variant-c .stage { position: relative; min-height: 100vh; padding: 35px 0 100px; }
      .variant-c .stage::before { position: absolute; top: -20vh; right: -12vw; width: 65vw; height: 65vw; border: 1px solid rgba(212,255,95,.16); border-radius: 50%; box-shadow: 0 0 0 70px rgba(212,255,95,.025), 0 0 0 140px rgba(212,255,95,.016); content: ''; pointer-events: none; }
      .variant-c .topbar { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
      .variant-c .brand { display: flex; align-items: center; gap: 12px; font-size: .9rem; font-weight: 650; }
      .variant-c .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: var(--ink); background: var(--lime); font: 11px var(--mono); }
      .variant-c nav { display: flex; gap: 22px; color: #8e929b; font: 11px var(--mono); text-transform: uppercase; }
      .variant-c nav a:hover { color: var(--lime); }
      .variant-c .hero { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr .95fr; align-items: center; gap: 80px; min-height: 700px; padding: 75px 0 115px; }
      .variant-c .hero h1 { max-width: 680px; margin-top: 25px; font-size: clamp(3.3rem, 7.7vw, 8.4rem); }
      .variant-c .hero h1 span { display: block; color: var(--lime); }
      .variant-c .body-copy { margin-top: 32px; }
      .variant-c .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
      .variant-c .orbit { position: relative; display: grid; min-height: 540px; place-items: center; }
      .variant-c .orbit-ring { position: absolute; width: min(38vw, 470px); aspect-ratio: 1; border: 1px dashed rgba(212,255,95,.28); border-radius: 50%; transform: rotate(-19deg); }
      .variant-c .orbit-ring::after { position: absolute; top: 8%; left: 9%; width: 12px; height: 12px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 26px var(--lime); content: ''; }
      .variant-c .phone { position: relative; z-index: 1; width: min(220px, 50vw); height: 445px; padding: 10px; border: 1px solid rgba(212,255,95,.45); border-radius: 32px; background: #171c1c; box-shadow: 22px 34px 70px rgba(0,0,0,.5), 0 0 70px rgba(212,255,95,.11); transform: rotate(9deg); }
      .variant-c .phone-screen { height: 100%; padding: 22px 17px; overflow: hidden; border-radius: 23px; background: linear-gradient(162deg, #b7d745, #26301a 52%, #0d1110); color: #10140e; }
      .variant-c .phone-screen small { font: 9px var(--mono); text-transform: uppercase; opacity: .8; }
      .variant-c .phone-screen h2 { margin: 90px 0 13px; font-size: 2.2rem; letter-spacing: -.09em; line-height: .9; }
      .variant-c .phone-screen p { max-width: 150px; font-size: .72rem; line-height: 1.5; }
      .variant-c .phone-bar { height: 4px; margin-top: 70px; border-radius: 9px; background: #11160c; opacity: .55; }
      .variant-c .orbit-label { position: absolute; z-index: 2; padding: 10px 12px; border: 1px solid rgba(212,255,95,.3); border-radius: 7px; color: var(--lime); background: rgba(8,9,13,.8); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; backdrop-filter: blur(10px); }
      .variant-c .orbit-label.one { top: 15%; right: 3%; } .variant-c .orbit-label.two { bottom: 17%; left: 1%; } .variant-c .orbit-label.three { right: 5%; bottom: 7%; color: #b7bac4; border-color: rgba(255,255,255,.14); }
      .variant-c .path { position: relative; z-index: 1; display: grid; grid-template-columns: .7fr 1.3fr; gap: 70px; padding: 74px 0 0; border-top: 1px solid rgba(255,255,255,.13); }
      .variant-c .path h2 { margin: 0; font-size: clamp(2rem, 4.3vw, 4.5rem); letter-spacing: -.08em; line-height: .92; }
      .variant-c .path-copy { color: #a5aab4; line-height: 1.7; }
      .variant-c .steps { display: grid; gap: 0; }
      .variant-c .step { display: grid; grid-template-columns: 55px 1fr; gap: 18px; padding: 0 0 31px; }
      .variant-c .step-num { color: var(--lime); font: 11px var(--mono); }
      .variant-c .step h3 { margin: 0 0 7px; font-size: 1rem; }
      .variant-c .step p { margin: 0; color: #8b919b; font-size: .84rem; line-height: 1.55; }
      .variant-c .step:last-child { padding-bottom: 0; }

      /* High-fidelity shared UI for A+ and C+. */
      .sample-note { display: inline-flex; align-items: center; gap: 7px; color: #78818b; font: 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      .sample-note::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ''; }
      .hf-section { padding: 105px 0; border-top: 1px solid rgba(255,255,255,.12); }
      .hf-section-head { display: grid; grid-template-columns: .72fr 1.28fr; gap: 60px; align-items: end; margin-bottom: 48px; }
      .hf-section-head h2 { max-width: 780px; margin: 0; font-size: clamp(2.4rem, 5vw, 5rem); letter-spacing: -.075em; line-height: .94; }
      .hf-section-head p { max-width: 500px; margin: 18px 0 0; color: #969faa; line-height: 1.7; }
      .metric-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.035); }
      .metric-cell { min-height: 118px; padding: 22px; border-right: 1px solid rgba(255,255,255,.12); }
      .metric-cell:last-child { border-right: 0; }
      .metric-cell strong { display: block; margin-bottom: 16px; color: #f4f6f7; font-size: 2rem; letter-spacing: -.06em; }
      .metric-cell span { color: #87909b; font: 10px var(--mono); line-height: 1.45; text-transform: uppercase; }
      .case-file { display: grid; grid-template-columns: .95fr 1.05fr; gap: 0; min-height: 520px; margin-bottom: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,.13); border-radius: 18px; background: rgba(255,255,255,.04); }
      .case-file:nth-child(even) .case-visual { order: 2; }
      .case-visual { position: relative; display: grid; min-height: 520px; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 30%, rgba(142,244,223,.16), transparent 18rem), #10171b; }
      .case-visual::before { position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px); background-size: 42px 42px; content: ''; }
      .case-copy { display: flex; flex-direction: column; justify-content: space-between; padding: 42px; }
      .case-copy h3 { max-width: 520px; margin: 18px 0; font-size: clamp(2rem, 4vw, 3.8rem); letter-spacing: -.065em; line-height: .95; }
      .case-copy > p { max-width: 520px; margin: 0; color: #9ca6b0; line-height: 1.7; }
      .case-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 38px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.12); }
      .case-meta span { color: #717b86; font: 9px var(--mono); text-transform: uppercase; }
      .case-meta strong { display: block; margin-top: 7px; color: #dce1e4; font-size: .82rem; font-weight: 550; line-height: 1.35; }
      .phone-real { position: relative; z-index: 2; width: 224px; height: 452px; padding: 9px; border: 1px solid rgba(255,255,255,.22); border-radius: 34px; background: #080a0c; box-shadow: 0 28px 75px rgba(0,0,0,.48); transform: rotate(-4deg); }
      .phone-real.alt { transform: rotate(5deg); }
      .phone-notch { position: absolute; z-index: 2; top: 15px; left: 50%; width: 78px; height: 19px; border-radius: 999px; background: #080a0c; transform: translateX(-50%); }
      .phone-ui { height: 100%; overflow: hidden; border-radius: 26px; color: #172025; background: #eaf5f1; }
      .phone-status { display: flex; justify-content: space-between; padding: 14px 14px 7px; font: 7px var(--mono); }
      .phone-appbar { display: flex; align-items: center; justify-content: space-between; padding: 15px; }
      .phone-appbar strong { font-size: 1rem; letter-spacing: -.04em; }
      .avatar-dot { width: 29px; height: 29px; border-radius: 50%; background: linear-gradient(135deg, #0b756b, #70e2ce); }
      .phone-hero-card { margin: 0 13px; padding: 18px; border-radius: 17px; color: white; background: linear-gradient(140deg, #0c3534, #116e67); }
      .phone-hero-card small { font: 7px var(--mono); text-transform: uppercase; opacity: .7; }
      .phone-hero-card b { display: block; margin: 19px 0 7px; font-size: 1.65rem; letter-spacing: -.08em; }
      .phone-hero-card p { margin: 0; font-size: .6rem; opacity: .75; }
      .phone-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
      .phone-mini { min-height: 82px; padding: 12px; border-radius: 13px; background: white; box-shadow: 0 6px 20px rgba(20,60,55,.08); }
      .phone-mini span { color: #6b7b79; font-size: .52rem; }
      .phone-mini strong { display: block; margin-top: 22px; font-size: .83rem; }
      .float-chip { position: absolute; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid rgba(142,244,223,.27); border-radius: 9px; color: #c3fff4; background: rgba(8,15,17,.84); font: 9px var(--mono); box-shadow: 0 12px 35px rgba(0,0,0,.28); backdrop-filter: blur(12px); }
      .float-chip.one { top: 18%; left: 8%; } .float-chip.two { right: 5%; bottom: 19%; }
      .float-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
      .architecture-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 15px; background: rgba(255,255,255,.035); }
      .architecture-node { position: relative; min-height: 150px; padding: 20px; border: 1px solid rgba(255,255,255,.1); border-radius: 11px; background: #11161c; }
      .architecture-node:not(:last-child)::after { position: absolute; top: 50%; right: -13px; z-index: 2; color: var(--cyan); content: '→'; transform: translateY(-50%); }
      .architecture-node span { color: var(--cyan); font: 9px var(--mono); text-transform: uppercase; }
      .architecture-node h3 { margin: 34px 0 8px; font-size: 1rem; }
      .architecture-node p { margin: 0; color: #77818c; font-size: .74rem; line-height: 1.5; }
      .experience-grid { display: grid; grid-template-columns: .65fr 1.35fr; gap: 70px; }
      .experience-list { border-top: 1px solid rgba(255,255,255,.12); }

      const order = ['a', 'b', 'c'];
      const key = new URLSearchParams(window.location.search).get('variant');
      let current = order.includes(key) ? key : 'a';
      const app = document.getElementById('app');
      const variantKey = document.getElementById('variant-key');
      const variantName = document.getElementById('variant-name');

      function render(next, updateUrl = true) {
        current = next;
        app.innerHTML = variants[current].render();
        variantKey.textContent = variants[current].key;
        variantName.textContent = variants[current].name;
        document.title = `${variants[current].name} · Mobile Systems Lab Prototype`;
        if (updateUrl) history.replaceState({}, '', `?variant=${current}`);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      function cycle(delta) {
        const index = (order.indexOf(current) + delta + order.length) % order.length;
        render(order[index]);
      }

      document.getElementById('previous').addEventListener('click', () => cycle(-1));
      document.getElementById('next').addEventListener('click', () => cycle(1));
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        if (target.matches('input, textarea, [contenteditable="true"]')) return;
        if (event.key === 'ArrowLeft') cycle(-1);
        if (event.key === 'ArrowRight') cycle(1);
      });
      render(current, false);
    </script>
